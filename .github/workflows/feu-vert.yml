name: Feu Vert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      resume:
        description: "Envoyer l'état des 4 cryptos sur Telegram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: feu-vert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Analyse et alertes
        run: python3 feu_vert_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && inputs.resume && '1' || '' }}
      - name: Mémoriser les voyants
        run: |
          git config user.name "feu-vert-bot"
          git config user.email "feu-vert-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Voyants mis à jour" && git pull --rebase && git push)
